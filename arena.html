<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTTv2 — Giải đấu & Lịch sử trận</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script>window.io || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"><\/script>')</script>
    <link rel="stylesheet" href="arena.css">
</head>

<body>
    <header class="hub-header">
        <a class="hub-logo" href="index.html" title="Về đấu trường">⚔️ <span>OTTv2 CODE ARENA</span></a>
        <nav class="hub-nav">
            <a href="index.html">🎮 Đấu trường</a>
            <a href="#/tournaments" data-nav="tournaments">🏆 Giải đấu</a>
            <a href="#/matches" data-nav="matches">📜 Lịch sử trận</a>
            <a href="#/leaderboard" data-nav="leaderboard">🏅 Xếp hạng</a>
            <a href="#/admin" data-nav="admin" id="nav-admin" style="display:none">🛠 Quản trị</a>
        </nav>
        <div class="hub-tools">
            <button id="user-btn" class="btn btn-ghost" title="Tài khoản">🔐 Đăng nhập</button>
            <button id="logout-btn" class="btn btn-ghost" style="display:none" title="Đăng xuất">⏏</button>
            <button id="theme-btn" class="btn btn-ghost" title="Đổi giao diện sáng/tối">🌙</button>
        </div>
    </header>

    <dialog id="auth-dialog" class="auth-dialog">
        <div class="row between"><h2 id="auth-title">Đăng nhập</h2><button class="btn btn-ghost btn-sm" id="auth-close" aria-label="Đóng">✖</button></div>
        <div class="row" style="margin-bottom:.6rem">
            <button class="btn btn-sm btn-primary" id="auth-tab-login">Đăng nhập</button>
            <button class="btn btn-sm" id="auth-tab-register">Tạo tài khoản</button>
        </div>
        <div class="form-grid" style="grid-template-columns:1fr">
            <label>Tên đăng nhập<input id="auth-user" autocomplete="username" maxlength="20" placeholder="3–20 ký tự: chữ, số, . _ -"></label>
            <label>Mật khẩu<input id="auth-pass" type="password" autocomplete="current-password" maxlength="128" placeholder="Tối thiểu 8 ký tự"></label>
        </div>
        <div class="form-grid" style="grid-template-columns:1fr"><label id="auth-admin-key-wrap" hidden>ADMIN_KEY<input id="auth-admin-key" type="password" autocomplete="off" placeholder="Nhập khóa admin"></label></div>
        <div id="auth-msg" class="small" style="min-height:1.2rem;margin-bottom:.5rem"></div>
        <button class="btn btn-primary" id="auth-submit">Đăng nhập</button>
    </dialog>

    <main id="view" class="hub-main" aria-live="polite"></main>
    <div id="toast" class="toast" role="status"></div>

    <script src="bot_templates.js"></script>
    <script src="arena.js"></script>
</body>

</html>
