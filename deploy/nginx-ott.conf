# OTTv2 Code Arena behind nginx  (put in /etc/nginx/conf.d/ott.conf, then: nginx -t && systemctl reload nginx)
# Run the app with:  TRUST_PROXY=1  COOKIE_SECURE=1  (when you terminate HTTPS here)

map $http_upgrade $ott_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ott_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name arena.example.com;
    # For HTTPS: add `listen 443 ssl;` + ssl_certificate / ssl_certificate_key (certbot --nginx does this),
    # and redirect port 80 to it. Keep everything below.

    client_max_body_size 2m;                 # same as the app's JSON limit (bot code is capped at 100KB)

    location / {
        proxy_pass http://ott_backend;
        proxy_http_version 1.1;

        # IMPORTANT: $http_host keeps the port. The app rejects WebSockets whose Origin host differs from the
        # Host header (cross-site WebSocket hijacking guard), so Host must be exactly what the browser used.
        proxy_set_header Host $http_host;

        # APPENDS the real peer address; the app (TRUST_PROXY=1) believes only the last hop, so a client can't
        # spoof its IP by sending its own X-Forwarded-For.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ott_connection_upgrade;
        proxy_read_timeout 3600s;            # idle sockets (live games) must not be cut after 60 s
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
